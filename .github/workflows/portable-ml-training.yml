name: Portable ML training checks

on:
  pull_request:
    paths:
      - "portable-ml-training/**"
      - ".github/workflows/portable-ml-training.yml"
  push:
    paths:
      - "portable-ml-training/**"
      - ".github/workflows/portable-ml-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-free-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portable-ml-training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON artifacts
        run: |
          python -m json.tool configs/qlora-smoke.json >/dev/null
          python -m json.tool notebooks/colab.ipynb >/dev/null
      - name: Validate shell scripts
        run: bash -n scripts/run.sh scripts/platforms/*.sh
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate resolved training plan
        run: ./scripts/run.sh --dry-run
