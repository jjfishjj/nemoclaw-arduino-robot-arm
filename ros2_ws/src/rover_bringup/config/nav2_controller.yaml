controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    publish_zero_velocity: true
    enable_stamped_cmd_vel: false
    odom_topic: /diff_drive_controller/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.30
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 12.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 48
      model_dt: 0.05
      batch_size: 1200
      iteration_count: 1
      temperature: 0.30
      gamma: 0.015
      vx_std: 0.16
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.45
      vx_min: -0.15
      vy_max: 0.0
      wz_max: 1.20
      ax_max: 0.80
      ax_min: -0.80
      ay_max: 0.0
      ay_min: 0.0
      az_max: 2.0
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
        trajectory_point_step: 2
        inflation_layer_name: inflation_layer
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.08
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.05
      footprint: "[[0.24, 0.19], [0.24, -0.19], [-0.24, -0.19], [-0.24, 0.19]]"
      footprint_padding: 0.03
      transform_tolerance: 0.2
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          expected_update_rate: 0.10
          observation_persistence: 0.0
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 3.5
          raytrace_min_range: 0.12
          raytrace_max_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.5
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.48
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.24, 0.19], [0.24, -0.19], [-0.24, -0.19], [-0.24, 0.19]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 3.5
          raytrace_min_range: 0.12
          raytrace_max_range: 4.0
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.48
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /diff_drive_controller/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    global_frame_id: map
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: mission_tasks
    mission_tasks:
      plugin: "rover_waypoint_tasks::MissionTaskExecutor"
      tasks: ["photo", "lidar_snapshot", "operator_confirm"]
      output_directory: "/tmp/rover_waypoint_tasks"
      confirmation_timeout_seconds: 120

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_safety
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.35
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    polygons: ["velocity_stop_zone", "slow_zone"]
    velocity_stop_zone:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/velocity_stop_zone
      enabled: true
      holonomic: false
      velocity_polygons: ["forward_fast", "forward_slow", "backward", "rotation", "stopped"]
      forward_fast:
        points: "[[0.65, 0.34], [0.65, -0.34], [-0.25, -0.34], [-0.25, 0.34]]"
        linear_min: 0.30
        linear_max: 0.70
        theta_min: -1.50
        theta_max: 1.50
      forward_slow:
        points: "[[0.42, 0.29], [0.42, -0.29], [-0.25, -0.29], [-0.25, 0.29]]"
        linear_min: 0.05
        linear_max: 0.30
        theta_min: -1.50
        theta_max: 1.50
      backward:
        points: "[[0.30, 0.29], [0.30, -0.29], [-0.50, -0.29], [-0.50, 0.29]]"
        linear_min: -0.30
        linear_max: -0.05
        theta_min: -1.50
        theta_max: 1.50
      rotation:
        points: "[[0.36, 0.34], [0.36, -0.34], [-0.36, -0.34], [-0.36, 0.34]]"
        linear_min: -0.05
        linear_max: 0.05
        theta_min: -1.50
        theta_max: 1.50
      stopped:
        points: "[[0.30, 0.28], [0.30, -0.28], [-0.30, -0.28], [-0.30, 0.28]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -2.0
        theta_max: 2.0
    slow_zone:
      type: "polygon"
      points: "[[0.90, 0.45], [0.90, -0.45], [-0.45, -0.45], [-0.45, 0.45]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: /collision_monitor/slow_zone
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      source_timeout: 0.35
      enabled: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    map_topic: /map
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "waypoint_follower", "collision_monitor"]
    bond_timeout: 4.0

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "amcl"]
    bond_timeout: 4.0
