<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__DASHBOARD_TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#08110f;--panel:#101d19;--line:#294038;--text:#e8f5ef;--muted:#91aaa0;--green:#55e39f;--amber:#ffbf5b;--red:#ff6b6b;--cyan:#52c7ea}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#123329 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:.16em;font-size:12px}h1{font-size:clamp(28px,4vw,48px);margin:5px 0 0;line-height:1.05}.status{padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:#10231d}.controls,.cards,.grid{display:grid;gap:14px}.controls{grid-template-columns:2fr repeat(3,1fr);padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px}.control label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select,button{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#081512;color:var(--text)}button{cursor:pointer;background:#18372c;border-color:#2b694f}.cards{grid-template-columns:repeat(5,1fr);margin:14px 0}.card,.panel{min-width:0;background:linear-gradient(150deg,#13241f,#0d1815);border:1px solid var(--line);border-radius:16px;padding:16px}.card small{color:var(--muted)}.card strong{display:block;font-size:28px;margin-top:6px}.grid{grid-template-columns:1.25fr .75fr}.panel h2{font-size:16px;margin:0 0 12px}.chart{display:flex;align-items:flex-end;gap:8px;height:240px;border-bottom:1px solid var(--line);padding:20px 4px 0}.group{flex:1;display:flex;gap:3px;height:100%;align-items:flex-end;position:relative}.bar{flex:1;min-width:4px;border-radius:5px 5px 0 0;transition:.2s}.bar.success{background:var(--green)}.bar.contact{background:var(--red)}.bar.time{background:var(--cyan)}.group span{position:absolute;top:100%;width:100%;padding-top:6px;text-align:center;color:var(--muted);font-size:10px;overflow:hidden}.legend{display:flex;gap:18px;color:var(--muted);margin-top:24px;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}.verdict{font-size:22px;font-weight:700;padding:16px;border-radius:12px;background:#0a1713}.verdict.pass{color:var(--green)}.verdict.fail{color:var(--red)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500}.wide{grid-column:1/-1}.table-wrap{max-width:100%;overflow:auto}.empty{display:none;text-align:center;padding:40px;color:var(--muted)}@media(max-width:850px){main{padding:16px}.top{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:minmax(0,1fr)}.card:last-child{grid-column:1/-1}}@media(max-width:480px){.controls,.cards{grid-template-columns:1fr}.card:last-child{grid-column:auto}.chart{height:190px}}
</style></head>
<body><main>
<header class="top"><div><div class="eyebrow">ROS 2 · Nav2 · Gazebo</div><h1>__DASHBOARD_TITLE__</h1></div><div class="status" id="count"></div></header>
<section class="controls"><div class="control"><label>匯入 trial / summary JSON</label><input id="files" type="file" accept="application/json,.json" multiple></div><div class="control"><label>成功率門檻</label><input id="successThreshold" type="number" min="0" max="100" value="90"></div><div class="control"><label>碰撞率上限</label><input id="collisionThreshold" type="number" min="0" max="100" value="0"></div><div class="control"><label>排序</label><select id="sort"><option value="name">試驗名稱</option><option value="success">成功率</option><option value="contacts">接觸碰撞</option><option value="time">時間</option></select></div></section>
<section class="cards" id="cards"></section>
<section class="grid" id="content"><article class="panel"><h2>每次試驗比較</h2><div class="chart" id="chart"></div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>成功率</span><span><i class="dot" style="background:var(--red)"></i>接觸率</span><span><i class="dot" style="background:var(--cyan)"></i>相對時間</span></div></article><article class="panel"><h2>驗收判定</h2><div id="verdict" class="verdict"></div><p id="reason" style="color:var(--muted)"></p><hr style="border-color:var(--line);border-width:1px 0 0"><p>門檻即時生效；匯入新資料後會在瀏覽器內重新彙整，不會上傳檔案。</p></article><article class="panel wide"><h2>試驗明細</h2><div class="table-wrap"><table><thead><tr><th>Trial</th><th>Success</th><th>Goals</th><th>Time</th><th>Distance</th><th>Min stop</th><th>Contacts</th><th>Max depth</th></tr></thead><tbody id="rows"></tbody></table></div></article></section><div class="panel empty" id="empty">沒有可用的 trial KPI。請匯入 JSON。</div>
</main><script>
const embedded=__DASHBOARD_DATA__;let reports=embedded.reports;
const $=id=>document.getElementById(id),pct=v=>`${(100*(Number(v)||0)).toFixed(1)}%`,num=(v,d=2)=>v==null?'—':Number(v).toFixed(d),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function summary(rs){const n=rs.length,sum=k=>rs.reduce((a,r)=>a+(Number(r[k])||0),0);return{trials:n,trialSuccess:sum('navigation_success')/n,waypoint:sum('success_rate')/n,contacts:sum('contact_collision_events'),goals:sum('goal_count'),time:sum('elapsed_seconds')/n,distance:sum('path_length_m')/n}}
function render(){if(!reports.length){$('content').style.display='none';$('cards').style.display='none';$('empty').style.display='block';return}$('content').style.display='grid';$('cards').style.display='grid';$('empty').style.display='none';const order=$('sort').value;reports.sort((a,b)=>order==='success'?b.success_rate-a.success_rate:order==='contacts'?b.contact_collision_events-a.contact_collision_events:order==='time'?b.elapsed_seconds-a.elapsed_seconds:String(a.trial_name).localeCompare(String(b.trial_name)));const s=summary(reports),cr=s.goals?s.contacts/s.goals:0;$('count').textContent=`${s.trials} trials · ${s.goals} goals`;$('cards').innerHTML=[["Trial success",pct(s.trialSuccess)],["Waypoint success",pct(s.waypoint)],["Contact rate",pct(cr)],["Mean time",`${num(s.time,1)} s`],["Mean distance",`${num(s.distance,1)} m`]].map(x=>`<div class=card><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');const maxTime=Math.max(...reports.map(r=>r.elapsed_seconds),1);$('chart').innerHTML=reports.map(r=>`<div class=group title="${esc(r.trial_name)}"><i class="bar success" style="height:${100*r.success_rate}%"></i><i class="bar contact" style="height:${100*(r.contact_collision_rate||0)}%"></i><i class="bar time" style="height:${100*r.elapsed_seconds/maxTime}%"></i><span>${esc(r.trial_name)}</span></div>`).join('');$('rows').innerHTML=reports.map(r=>`<tr><td>${esc(r.trial_name)}</td><td>${pct(r.success_rate)}</td><td>${r.completed_goals}/${r.goal_count}</td><td>${num(r.elapsed_seconds,1)}s</td><td>${num(r.path_length_m,1)}m</td><td>${num(r.minimum_stop_distance_m)}m</td><td>${r.contact_collision_events||0}</td><td>${num(r.maximum_contact_penetration_m,3)}m</td></tr>`).join('');const pass=s.waypoint>=Number($('successThreshold').value)/100&&cr<=Number($('collisionThreshold').value)/100;$('verdict').className=`verdict ${pass?'pass':'fail'}`;$('verdict').textContent=pass?'PASS — 可接受':'FAIL — 需要調校';$('reason').textContent=`平均 waypoint ${pct(s.waypoint)}（門檻 ${$('successThreshold').value}%），接觸率 ${pct(cr)}（上限 ${$('collisionThreshold').value}%）。`}
$('files').addEventListener('change',async e=>{const loaded=[];for(const f of e.target.files){try{const x=JSON.parse(await f.text());if('goal_count'in x){x.trial_name=f.name.replace(/\.json$/,'');loaded.push(x)}}catch(err){console.warn(f.name,err)}}reports=loaded;render()});['successThreshold','collisionThreshold','sort'].forEach(id=>$(id).addEventListener('input',render));render();
</script></body></html>
