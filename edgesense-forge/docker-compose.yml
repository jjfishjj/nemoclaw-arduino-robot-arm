services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edgesense
      POSTGRES_USER: edgesense
      POSTGRES_PASSWORD: edgesense-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgesense -d edgesense"]
      interval: 5s
      timeout: 4s
      retries: 10
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 5s
      timeout: 4s
      retries: 5

  edge-service:
    build: .
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://edgesense:edgesense-local@postgres:5432/edgesense
      RETENTION_DAYS: 30
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
